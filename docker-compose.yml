services:
  postgres:
    image: postgres:16.4-alpine
    container_name: dialogpulse_postgres
    environment:
      POSTGRES_DB: dialogpulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - dialogpulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dialogpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: dialogpulse_redis
    ports:
      - "6380:6379"
    volumes:
      - dialogpulse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: dialogpulse_migrations
    command: alembic upgrade head
    working_dir: /app/backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/dialogpulse
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app/backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: dialogpulse_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    working_dir: /app/backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/dialogpulse
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: dialogpulse_celery_worker
    command: celery -A app.core.celery_app:celery_app worker --loglevel=info --pool=solo
    working_dir: /app/backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/dialogpulse
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_DIALOG_PULSE_URL: http://127.0.0.1:8000
    container_name: dialogpulse_frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  dialogpulse_postgres_data:
  dialogpulse_redis_data: